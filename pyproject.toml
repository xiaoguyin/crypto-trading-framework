[project]
name = "crypto-trading-framework"
version = "0.1.0"
description = "A non-blocking, strategy-oriented framework for cryptocurrency trading systems."
readme = "README.md"
authors = [
    { name = "xiaoguyin", email = "xiaoguyin@qq.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["crypto_trading_framework"]

[tool.ty.environment]
python-version = "3.13"
root = ["./src", "./tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=crypto_trading_framework", "--cov-branch"]

[tool.coverage.run]
branch = true
source = ["crypto_trading_framework"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
